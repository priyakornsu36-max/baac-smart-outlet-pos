                        * {
                          box-sizing: border-box;
                        }

                        html,
                        body,
                        button,
                        input,
                        select,
                        textarea {
                          font-family: 'FC Subject Rounded', 'Tahoma', sans-serif;
                        }

                        body {
                          margin: 0;
                          min-height: 100vh;
                          color: #173b2b;
                          background:
                            radial-gradient(circle at 8% 10%, rgba(255,255,255,.95) 0 4%, transparent 27%),
                            radial-gradient(circle at 92% 18%, rgba(226,245,231,.95) 0 5%, transparent 29%),
                            linear-gradient(145deg, #eef8f0 0%, #fff9ec 50%, #e3f0e6 100%);
                        }

                        .page {
                          width: min(1180px, calc(100% - 34px));
                          margin: 0 auto;
                          padding: 28px 0 46px;
                        }

                        /* =========================
                           ส่วนหัวร้าน
                        ========================== */
                        .store-header {
                          overflow: visible;
                          margin-bottom: 38px;
                          border: 0;
                          border-radius: 0;
                          background: transparent;
                          box-shadow: none;
                        }

                        .header-copy {
                          display: none;
                        }

                        .brand-title {
                          margin: 0;
                          color: #ffffff;
                          font-size: clamp(34px, 4.7vw, 54px);
                          line-height: .98;
                          font-weight: 700;
                          letter-spacing: .8px;
                          text-shadow:
                            0 3px 0 rgba(0,0,0,.10),
                            0 7px 14px rgba(0,0,0,.16);
                        }

                        .brand-subtitle {
                          margin-top: 10px;
                          color: rgba(255,255,255,.93);
                          font-size: clamp(20px, 2.3vw, 28px);
                          line-height: 1.15;
                          font-weight: 400;
                          text-shadow: 0 3px 8px rgba(0,0,0,.14);
                        }

                        /* หลังคาร้าน */
                        .awning {
                          position: relative;
                          height: 210px;
                          margin: 0;
                          width: 100%;
                          filter: drop-shadow(0 16px 16px rgba(45, 76, 56, .12));
                        }

                        .awning-top {
                          position: absolute;
                          left: 0;
                          right: 0;
                          top: 0;
                          height: 142px;
                          border-radius: 34px 34px 0 0;
                          background:
                            radial-gradient(circle at 91% 12%, rgba(255,255,255,.10) 0 9%, transparent 10%),
                            linear-gradient(145deg, #0a6a3b 0%, #0e7b45 58%, #24955b 100%);
                          box-shadow:
                            inset 0 7px 0 rgba(255,255,255,.08),
                            inset 0 -10px 18px rgba(0,0,0,.04);
                        }

                        .awning-copy {
                          position: absolute;
                          inset: 0;
                          display: flex;
                          flex-direction: column;
                          align-items: center;
                          justify-content: center;
                          padding: 18px 24px 24px;
                          text-align: center;
                          z-index: 2;
                        }

                        .awning-edge {
                          position: absolute;
                          left: 0;
                          right: 0;
                          top: 138px;
                          height: 68px;
                          display: grid;
                          grid-template-columns: repeat(8, 1fr);
                        }

                        .awning-edge span {
                          display: block;
                          height: 56px;
                          border-radius: 0 0 22px 22px;
                        }

                        .awning-edge span:nth-child(4n+1) {
                          background: #f3ca58;
                        }

                        .awning-edge span:nth-child(4n+2) {
                          background: #fff3b6;
                        }

                        .awning-edge span:nth-child(4n+3) {
                          background: #2c9258;
                        }

                        .awning-edge span:nth-child(4n+4) {
                          background: #fff5bf;
                        }

                        /* =========================
                           เมนู 6 ปุ่ม
                        ========================== */
                        .menu-grid {
                          display: grid;
                          grid-template-columns: repeat(3, minmax(0, 1fr));
                          gap: 24px;
                        }

                        .menu-card {
                          appearance: none;
                          width: 100%;
                          min-height: 270px;
                          padding: 26px 22px 28px;
                          border-radius: 36px;
                          border: 1px solid rgba(255,255,255,.88);
                          cursor: pointer;
                          text-align: center;
                          transition:
                            transform .18s ease,
                            box-shadow .18s ease,
                            filter .18s ease;
                          display: flex;
                          flex-direction: column;
                          align-items: center;
                          justify-content: center;
                          overflow: hidden;
                          position: relative;
                          backdrop-filter: blur(2px);
                          -webkit-backdrop-filter: blur(2px);
                        }

                        .menu-card::before {
                          content: "";
                          position: absolute;
                          left: 16px;
                          right: 16px;
                          top: 12px;
                          height: 20px;
                          border-radius: 999px;
                          background: rgba(255,255,255,.20);
                          pointer-events: none;
                          z-index: 0;
                        }

                        .menu-card::after {
                          content: "";
                          position: absolute;
                          left: 8%;
                          right: 8%;
                          bottom: 10px;
                          height: 16px;
                          border-radius: 999px;
                          background: rgba(255,255,255,.08);
                          pointer-events: none;
                          z-index: 0;
                        }

                        .menu-card:hover {
                          transform: translateY(-6px) scale(1.012);
                          filter: saturate(1.03) brightness(1.01);
                        }

                        .menu-card:active {
                          transform: translateY(6px) scale(.995);
                        }

                        .menu-card img {
                          position: relative;
                          z-index: 1;
                          width: 180px;

                    /* ===== iPad Responsive FINAL: ปรับเฉพาะขนาด/การจัดวาง ไม่เปลี่ยนดีไซน์เดิม ===== */

                    .menu-grid{
