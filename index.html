    html, body, body *, body *::before, body *::after,
    button, input, select, textarea {
      font-family:'FC Subject Rounded', sans-serif !important;
      font-synthesis:none;

    *{box-sizing:border-box}
    body{
      margin:0;background:linear-gradient(135deg,#f8f5e9,#eef7ed);
      color:#173e31;font-family:'FC Subject Rounded','Tahoma',sans-serif;
    }
    button,input{font:inherit}
    .topbar{
      position:sticky;top:0;z-index:20;background:#08783f;color:#fff;
      padding:10px 18px;box-shadow:0 5px 18px rgba(0,0,0,.14);
      display:flex;align-items:center;justify-content:space-between;gap:16px
    }
    .brand{font-size:25px;font-weight:700;line-height:1}
    .sub{font-size:15px;opacity:.92;margin-top:3px}
    .back{
      border:0;border-radius:16px;background:#fff;color:#08783f;
      padding:9px 18px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 #cddbd2
    }
    .layout{
      width:min(1450px,97vw);margin:14px auto 24px;
      display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px
    }
    .panel{
      background:rgba(255,255,255,.9);border:1px solid #dce8df;border-radius:28px;
      box-shadow:0 16px 35px rgba(50,85,65,.12);padding:20px
    }
    .toolbar{display:flex;gap:12px;align-items:center;margin-bottom:16px}
    .search{
      width:100%;border:2px solid #d4e4da;border-radius:18px;
      padding:13px 17px;font-size:20px;outline:none;background:#fff
    }
    .search:focus{border-color:#5daf7d}
    .products{
      display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;
      max-height:calc(100vh - 175px);overflow:auto;padding:3px 5px 20px 3px
    }
    .product{
      border:1px solid #cfe3d5;background:linear-gradient(145deg,#fff,#edf7f0);
      border-radius:23px;padding:15px;min-height:170px;text-align:left;cursor:pointer;
      box-shadow:0 7px 0 #c9ddcf,0 12px 18px rgba(54,85,67,.09);
      transition:.12s transform
    }
    .product:hover{transform:translateY(-2px)}
    .product:active{transform:translateY(4px);box-shadow:0 3px 0 #c9ddcf}
    .product.soldout{opacity:.43;filter:grayscale(.5);cursor:not-allowed}
    .pname{font-size:23px;font-weight:700;line-height:1.1;min-height:50px}
    .pprice{font-size:25px;font-weight:700;color:#08783f;margin-top:8px}
    .pstock{font-size:17px;margin-top:7px;color:#5f7267}
    .pstock.low{color:#d97a00}.pstock.out{color:#b93232}

    .cart-title{font-size:27px;font-weight:700;margin-bottom:12px}
    .cart{max-height:285px;overflow:auto;border-top:1px solid #e4ece6}
    .empty{text-align:center;color:#87968d;padding:34px 10px;font-size:19px}
    .cart-row{
      display:grid;grid-template-columns:1fr auto;gap:8px;
      padding:13px 0;border-bottom:1px solid #e4ece6
    }
    .cart-name{font-size:20px;font-weight:700}
    .cart-price{font-size:17px;color:#697b70}
    .qty{display:flex;align-items:center;gap:7px}
    .qty button{
      width:34px;height:34px;border:0;border-radius:11px;background:#e2f1e7;
      color:#08783f;font-size:22px;font-weight:700;cursor:pointer
    }
    .qty span{min-width:24px;text-align:center;font-size:20px;font-weight:700}
    .remove{background:#fae4e1!important;color:#a53c34!important}
    .totalbox{
      margin:16px 0;padding:15px 17px;border-radius:20px;
      background:#e5f4e9;display:flex;justify-content:space-between;align-items:center
    }
    .total-label{font-size:22px;font-weight:700}
    .total{font-size:34px;font-weight:700;color:#08783f}

    .section{margin-top:16px}
    .label{font-size:19px;font-weight:700;margin-bottom:7px}
    .phone-row{display:flex;gap:8px}
    .input{
      width:100%;border:2px solid #d8e4dc;border-radius:15px;padding:10px 13px;
      font-size:19px;outline:none;background:#fff
    }
    .smallbtn{
      white-space:nowrap;border:0;border-radius:15px;padding:9px 15px;
      background:#dcefe3;color:#08783f;font-weight:700;cursor:pointer
    }
    .memberbox{
      display:none;margin-top:9px;padding:11px 13px;border-radius:15px;
      background:#f0f7f2;font-size:17px
    }
    .notfound{background:#fff2dd;color:#8a5a08}
    .add-member{display:none;margin-top:9px}
    .paymethods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .paybtn{
      border:2px solid #d6e4da;border-radius:18px;padding:12px;background:#fff;
      font-size:20px;font-weight:700;cursor:pointer
    }
    .paybtn.active{border-color:#08783f;background:#dff2e5;color:#08783f}
    .cashbox{display:none;margin-top:10px}
    .change{margin-top:7px;font-size:19px;font-weight:700}
    .checkout{
      width:100%;margin-top:17px;border:0;border-radius:20px;padding:14px;

    .app-dialog-overlay{

    @keyframes dialogPop{

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
const BAAC_API_URL = 'https://script.google.com/macros/s/AKfycbwCS4XlPPlEaZEasQqxCbXFkkom83QF9r86pehdXfq0C2M-bLqNgE5APMBAHOhKTgFmUQ/exec';

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}

function baacJsonp(api, params) {
  params = params || {};
  return new Promise((resolve, reject) => {
    const cb = '__baac_cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    const timer = setTimeout(() => cleanup(new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ')), 15000);
    function cleanup(err, data) {
      clearTimeout(timer);
      try { delete window[cb]; } catch(e) {}
      if (script.parentNode) script.parentNode.removeChild(script);
      err ? reject(err) : resolve(data);
    }
    window[cb] = data => cleanup(null, data);
    const q = new URLSearchParams(Object.assign({api:api, callback:cb}, params));
    script.onerror = () => cleanup(new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ'));
    script.src = BAAC_API_URL + '?' + q.toString();
    document.head.appendChild(script);
  });
}

function baacPost(payload) {
  /* ส่งแบบ form ไป Apps Script โดยไม่พึ่ง CORS
     ผลสำเร็จจริงจะตัดสินจาก api=tx เท่านั้น */
  return new Promise((resolve, reject) => {
    const frameName = '__baac_post_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const iframe = document.createElement('iframe');
    iframe.name = frameName;
    iframe.style.display = 'none';

    const form = document.createElement('form');
    form.method = 'POST';
    form.action = BAAC_API_URL;
    form.target = frameName;
    form.style.display = 'none';

    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = 'payload';
    input.value = JSON.stringify(payload || {});
    form.appendChild(input);

    document.body.appendChild(iframe);
    document.body.appendChild(form);

    try {
      form.submit();
      setTimeout(() => {
        try { form.remove(); } catch(e) {}
        try { iframe.remove(); } catch(e) {}
      }, 15000);
      resolve(true);
    } catch (e) {
      try { form.remove(); } catch(x) {}
      try { iframe.remove(); } catch(x) {}
      reject(e);
    }
  });
}

function normalizePhoneClient(v){
  let s = String(v || '').replace(/\D/g,'');
  if(s.length === 9) s = '0' + s;
  return s;
}

function getMemberCache(){
  try { return JSON.parse(localStorage.getItem('baacMemberCache') || '{}') || {}; }
  catch(e){ return {}; }
}

function cacheMember(member){
  if(!member || !member.found || !member.phone) return;
  const cache = getMemberCache();
  cache[normalizePhoneClient(member.phone)] = member;
  localStorage.setItem('baacMemberCache', JSON.stringify(cache));
}

function getCachedMember(phone){
  return getMemberCache()[normalizePhoneClient(phone)] || null;
}

function cacheMembers(members){
  const cache = getMemberCache();
  (members || []).forEach(member => {
    if(member && member.found && member.phone){
      cache[normalizePhoneClient(member.phone)] = member;
    }
  });
  localStorage.setItem('baacMemberCache', JSON.stringify(cache));
}

function refreshMemberCache(){
  if(!navigator.onLine) return;
  baacJsonp('members')
    .then(x => {
      if(x && x.success && Array.isArray(x.members)) cacheMembers(x.members);
    })
    .catch(() => {});
}

async function baacWaitTx(id) {
  if(!id) throw new Error('ไม่พบรหัสธุรกรรมเครื่อง');
  for (let i = 0; i < 15; i++) {
    try {
      const x = await baacJsonp('tx', {id:id});
      if (x && x.success && x.found === true && x.confirmed !== false) return x;
    } catch(e) {}
    await new Promise(r => setTimeout(r, 1000));
  }
  throw new Error('เซิร์ฟเวอร์ยังไม่ยืนยันการบันทึกบิล');
}

function makeGasRunner() {
  let ok = function(){};
  let fail = function(){};
  const runner = {
    withSuccessHandler(fn) { ok = fn || function(){}; return runner; },
    withFailureHandler(fn) { fail = fn || function(){}; return runner; },
    getPosProducts() { baacJsonp('products').then(x => { if(!x.success) throw new Error(x.message); ok(x.products || []); }).catch(fail); },
    lookupMember(phone) { baacJsonp('member',{phone:phone}).then(x => { if(!x.success) throw new Error(x.message); ok(x.member || {found:false}); }).catch(fail); },
    getSalesHistoryDates() { baacJsonp('salesdates').then(x => { if(!x.success) throw new Error(x.message); ok(x.dates || []); }).catch(fail); },
    getBillsByDate(date) { baacJsonp('bills',{date:date}).then(x => { if(!x.success) throw new Error(x.message); ok(x.data || {date:date,bills:[]}); }).catch(fail); },
    getSalesByDate(date) { baacJsonp('salesrows',{date:date}).then(x => { if(!x.success) throw new Error(x.message); ok(x.data || {date:date,rows:[]}); }).catch(fail); },
    async checkoutSale(payload) {
      try {
        await baacPost(Object.assign({api:'checkout'}, payload));
        await baacWaitTx(payload.clientTransactionId);
        const total=(payload.items||[]).reduce((sum,it)=>{
          const p=(Array.isArray(products)?products:[]).find(x=>String(x.id)===String(it.id));
          return sum + (p ? Number(p.price||0)*Number(it.qty||0) : 0);
        },0);
        let member={found:false};
        if(payload.phone) { try { const m=await baacJsonp('member',{phone:payload.phone}); member=m.member||member; } catch(e){} }
        ok({success:true,synced:true,total:total,paymentMethod:payload.paymentMethod,cashReceived:payload.paymentMethod==='เงินสด'?Number(payload.cashReceived||0):total,change:payload.paymentMethod==='เงินสด'?Number(payload.cashReceived||0)-total:0,memberFound:!!member.found,memberId:member.id||'',pointsEarned:0});
      } catch(e) { fail(e); }
    },
    async addMemberByStaff(data) {
      try {
        await baacPost(Object.assign({api:'addmember'},data));
        await new Promise(r=>setTimeout(r,800));
        const x=await baacJsonp('member',{phone:data.phone});
        if(!x.member || !x.member.found) throw new Error('ยังยืนยันการเพิ่มสมาชิกไม่ได้');
        ok(x.member);
      } catch(e) { fail(e); }
    },
    async cancelBill(saleIds,reason) {
      try { await baacPost({api:'cancelbill',saleIds:saleIds,reason:reason}); await new Promise(r=>setTimeout(r,900)); ok({success:true}); } catch(e) { fail(e); }
    },
    async voidSale(saleId) {
      try { await baacPost({api:'cancelbill',saleIds:[saleId],reason:'ยกเลิกรายการ'}); await new Promise(r=>setTimeout(r,900)); ok({success:true}); } catch(e) { fail(e); }
    }
  };
  return runner;
}

window.google = window.google || {};
window.google.script = window.google.script || {};
Object.defineProperty(window.google.script, 'run', { get: makeGasRunner });
</script>

<script>
  let products = [];
  let cart = [];
  let paymentMethod = '';
  let currentMember = null;

  document.addEventListener('DOMContentLoaded', function(){
    restoreCachedProducts();
    loadProducts();
    refreshMemberCache();
    updateHeldCount();
    updateConnectionStatus();
    updatePendingBadge();
    window.addEventListener('online', function(){
      updateConnectionStatus();
      syncPendingSales();
      loadProducts();
      refreshMemberCache();
    });
    window.addEventListener('offline', function(){
      updateConnectionStatus();
    });
    setInterval(function(){
      updateConnectionStatus();
      if(navigator.onLine) syncPendingSales();
    }, 15000);
  });


  function showAppAlert(message, title, type){
    return new Promise(function(resolve){
      const overlay = document.getElementById('appDialogOverlay');
      const icon = document.getElementById('appDialogIcon');
      const titleEl = document.getElementById('appDialogTitle');
      const msgEl = document.getElementById('appDialogMessage');
      const input = document.getElementById('appDialogInput');
      const cancelBtn = document.getElementById('appDialogCancel');
      const okBtn = document.getElementById('appDialogOk');

      titleEl.textContent = title || 'แจ้งเตือน';
      msgEl.textContent = message || '';
      input.style.display = 'none';
      cancelBtn.style.display = 'none';

      icon.textContent = type === 'error' ? '!' : '✓';
      icon.style.background = type === 'error' ? '#fae2df' : '#e3f4e8';
      icon.style.color = type === 'error' ? '#a23b34' : '#08783f';

      okBtn.className = 'app-dialog-ok';
      okBtn.textContent = 'ตกลง';

      const finish = function(){
        overlay.classList.remove('show');
        okBtn.onclick = null;
        resolve();
      };

      okBtn.onclick = finish;
      overlay.classList.add('show');
    });
  }

  function showReasonDialog(){
    return new Promise(function(resolve){
      const overlay = document.getElementById('appDialogOverlay');
      const icon = document.getElementById('appDialogIcon');
      const titleEl = document.getElementById('appDialogTitle');
      const msgEl = document.getElementById('appDialogMessage');
      const input = document.getElementById('appDialogInput');
      const cancelBtn = document.getElementById('appDialogCancel');
      const okBtn = document.getElementById('appDialogOk');

      icon.textContent = '!';
      icon.style.background = '#fff0db';
      icon.style.color = '#b36c00';

      titleEl.textContent = 'ยกเลิกบิล';
      msgEl.textContent = 'กรุณาระบุเหตุผลการยกเลิกบิล';
      input.value = '';
      input.placeholder = '';
      input.style.display = 'block';

      cancelBtn.style.display = 'block';
      cancelBtn.textContent = 'ยกเลิก';
      okBtn.className = 'app-dialog-danger';
      okBtn.textContent = 'ยืนยันยกเลิกบิล';

      const cleanup = function(){
        overlay.classList.remove('show');
        cancelBtn.onclick = null;
        okBtn.onclick = null;
      };

      cancelBtn.onclick = function(){
        cleanup();
        resolve(null);
      };

      okBtn.onclick = function(){
        const reason = input.value.trim();
        if(!reason){
          input.focus();
          input.style.borderColor = '#b93e36';
          return;
        }
        cleanup();
        input.style.borderColor = '';
        resolve(reason);
      };

      overlay.classList.add('show');
      setTimeout(function(){ input.focus(); }, 80);
    });
  }


  function showAppConfirm(message, title, danger){
    return new Promise(function(resolve){
      const overlay = document.getElementById('appDialogOverlay');
      const icon = document.getElementById('appDialogIcon');
      const titleEl = document.getElementById('appDialogTitle');
      const msgEl = document.getElementById('appDialogMessage');
      const input = document.getElementById('appDialogInput');
      const cancelBtn = document.getElementById('appDialogCancel');
      const okBtn = document.getElementById('appDialogOk');

      icon.textContent = danger ? '!' : '?';
      icon.style.background = danger ? '#fff0db' : '#e3f4e8';
      icon.style.color = danger ? '#b36c00' : '#08783f';

      titleEl.textContent = title || 'ยืนยันรายการ';
      msgEl.textContent = message || '';
      input.style.display = 'none';

      cancelBtn.style.display = 'block';
      cancelBtn.textContent = 'ยกเลิก';

      okBtn.className = danger ? 'app-dialog-danger' : 'app-dialog-ok';
      okBtn.textContent = 'ตกลง';

      const cleanup = function(){
        overlay.classList.remove('show');
        cancelBtn.onclick = null;
        okBtn.onclick = null;
      };

      cancelBtn.onclick = function(){
        cleanup();
        resolve(false);
      };

      okBtn.onclick = function(){
        cleanup();
        resolve(true);
      };

      overlay.classList.add('show');
    });
  }

  let appToastTimer = null;
  function showToast(message){
    const toast = document.getElementById('appToast');
    const text = document.getElementById('appToastText');

    text.textContent = message || '';
    toast.classList.add('show');

    clearTimeout(appToastTimer);
    appToastTimer = setTimeout(function(){
      toast.classList.remove('show');
    }, 2200);
  }

  function loadProducts(){
    if(!navigator.onLine){
      restoreCachedProducts();
      renderProducts();
      renderCart();
      return;
    }

    google.script.run
      .withSuccessHandler(function(data){
        products = data || [];
        try{
          localStorage.setItem('baacPosProductsCache', JSON.stringify(products));
        }catch(e){}
        renderProducts();
        renderCart();
        updateConnectionStatus();
      })
      .withFailureHandler(function(){
        restoreCachedProducts();
        renderProducts();
        renderCart();
        updateConnectionStatus(true);
      })
      .getPosProducts();
  }

  function restoreCachedProducts(){
    try{
      const cached = JSON.parse(localStorage.getItem('baacPosProductsCache') || '[]');
      if(Array.isArray(cached) && cached.length){
        products = cached;
        return true;
      }
    }catch(e){}
    return false;
  }

  function renderProducts(){
    const q = document.getElementById('search').value.trim().toLowerCase();
    const box = document.getElementById('products');

    const list = products.filter(function(p){
      return !q || p.name.toLowerCase().includes(q) || p.id.toLowerCase().includes(q);
    });

    box.innerHTML = list.map(function(p){
      const out = p.stock <= 0;
      const stockClass = out ? 'out' : (p.stock <= 5 ? 'low' : '');
      return `
        <button class="product ${out ? 'soldout' : ''}" ${out ? 'disabled' : ''}
          onclick="addToCart('${escAttr(p.id)}')">
          <div class="product-image">
            ${p.image
              ? `<img src="${esc(p.image)}" alt="${esc(p.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
              : ''}
            <div class="product-placeholder" style="${p.image ? 'display:none' : 'display:flex'}">🛍️</div>
          </div>
          <div class="pname">${esc(p.name)}</div>
          <div class="pprice">${money(p.price)} บาท</div>
          <div class="pstock ${stockClass}">
            ${out ? 'สินค้าหมด' : 'คงเหลือ ' + p.stock + ' ' + esc(p.unit)}
          </div>
        </button>
      `;
    }).join('') || '<div class="empty">ไม่พบสินค้า</div>';
  }

  function addToCart(id){
    const p = products.find(x => x.id === id);
    if(!p || p.stock <= 0) return;

    const row = cart.find(x => x.id === id);
    if(row){
      if(row.qty >= p.stock) showAppAlert('สินค้าเหลือ ' + p.stock + ' ' + p.unit, 'สินค้าไม่พอ', 'error'); return;
      row.qty++;
    }else{
      cart.push({id:p.id,name:p.name,price:p.price,unit:p.unit,stock:p.stock,qty:1});
    }
    renderCart();
  }

  function changeQty(id, delta){
    const row = cart.find(x => x.id === id);
    if(!row) return;
    const next = row.qty + delta;
    if(next <= 0){
      cart = cart.filter(x => x.id !== id);
    }else if(next <= row.stock){
      row.qty = next;
    }
    renderCart();
  }

  function removeItem(id){
    cart = cart.filter(x => x.id !== id);
    renderCart();
  }

  function renderCart(){
    const box = document.getElementById('cart');
    if(!cart.length){
      box.innerHTML = '<div class="empty">ยังไม่มีสินค้า</div>';
    }else{
      box.innerHTML = cart.map(function(x){
        return `
          <div class="cart-row">
            <div class="cart-product">
              <div class="cart-thumb">
                ${(() => {
                  const p = products.find(p => p.id === x.id);
                  return p && p.image
                    ? `<img src="${esc(p.image)}" alt="${esc(x.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><span style="display:none">🛍️</span>`
                    : `<span>🛍️</span>`;
                })()}
              </div>
              <div>
                <div class="cart-name">${esc(x.name)}</div>
                <div class="cart-price">จำนวน ${x.qty} ${esc(x.unit || "")} • ${money(x.price*x.qty)} บาท</div>
              </div>
            </div>
            <div class="qty">
              <button onclick="changeQty('${escAttr(x.id)}',-1)">−</button>
              <span>${x.qty}</span>
              <button onclick="changeQty('${escAttr(x.id)}',1)">+</button>
              <button class="remove" onclick="removeItem('${escAttr(x.id)}')">×</button>
            </div>
          </div>
        `;
      }).join('');
    }

    document.getElementById('total').textContent = money(getTotal()) + ' บาท';
    calcChange();
  }

  function getTotal(){
    return cart.reduce((sum,x) => sum + x.price*x.qty, 0);
  }

  function checkMember(){
    const phoneInput = document.getElementById('phone');
    const phone = normalizePhoneClient(phoneInput.value.trim());
    phoneInput.value = phone;
    if(!phone) return resetMember();

    const box = document.getElementById('memberbox');
    const add = document.getElementById('addMemberBtn');

    /* ออฟไลน์: ใช้สมาชิกที่เคยตรวจพบจาก cache ได้
       ถ้ายังไม่เคยพบ ก็ยังขายได้และเก็บเบอร์ไว้ให้ server ตรวจตอน sync */
    if(!navigator.onLine){
      const cached = getCachedMember(phone);
      box.style.display = 'block';
      if(cached){
        currentMember = cached;
        box.className = 'memberbox';
        box.innerHTML = '<b>พบสมาชิกจากข้อมูลในเครื่อง</b>' +
          (cached.name ? ' • ' + esc(cached.name) : '') +
          '<br>เบอร์นี้จะถูกตรวจสอบอีกครั้งเมื่อซิงก์';
      }else{
        currentMember = null;
        box.className = 'memberbox notfound';
        box.innerHTML = '<b>ออฟไลน์</b> บันทึกเบอร์ ' + esc(phone) + ' ไว้กับบิลแล้ว • ระบบจะตรวจสมาชิกเมื่อออนไลน์';
      }
      add.style.display = 'none';
      return;
    }

    google.script.run
      .withSuccessHandler(function(data){
        currentMember = data && data.found ? data : null;
        box.style.display = 'block';

        if(currentMember){
          cacheMember(currentMember);
          box.className = 'memberbox';
          box.innerHTML =
            '<b>พบสมาชิก</b>' +
            (currentMember.name ? ' • ' + esc(currentMember.name) : '') +
            '<br>คะแนนสะสม ' + money(currentMember.points) +
            ' คะแนน • ' + esc(currentMember.tier || 'สมาชิกทั่วไป');
          add.style.display = 'none';
        }else{
          box.className = 'memberbox notfound';
          box.innerHTML = '<b>ยังไม่พบสมาชิก</b> สามารถเพิ่มสมาชิกแล้วใช้กับบิลนี้ได้ทันที';
          add.style.display = 'inline-block';
        }
      })
      .withFailureHandler(function(){
        const cached = getCachedMember(phone);
        box.style.display = 'block';
        add.style.display = 'none';
        if(cached){
          currentMember = cached;
          box.className = 'memberbox';
          box.innerHTML = '<b>ใช้ข้อมูลสมาชิกในเครื่อง</b>' + (cached.name ? ' • ' + esc(cached.name) : '');
        }else{
          currentMember = null;
          box.className = 'memberbox notfound';
          box.innerHTML = '<b>ยังติดต่อเซิร์ฟเวอร์ไม่ได้</b> เก็บเบอร์นี้ไว้กับบิลและตรวจตอนซิงก์';
        }
      })
      .lookupMember(phone);
  }

  function resetMember(){
    currentMember = null;
    document.getElementById('memberbox').style.display = 'none';
    document.getElementById('addMemberBtn').style.display = 'none';
  }

  function openMemberModal(){
    const phone = document.getElementById('phone').value.trim();
    document.getElementById('newMemberPhone').value = phone;
    document.getElementById('memberModal').classList.add('show');
  }

  function closeMemberModal(){
    document.getElementById('memberModal').classList.remove('show');
  }

  function saveMember(){
    const name = document.getElementById('newMemberName').value.trim();
    const phone = document.getElementById('newMemberPhone').value.trim();
    if(!phone){ showAppAlert('กรุณากรอกเบอร์โทรศัพท์','ข้อมูลสมาชิก','error'); return; }

    google.script.run
      .withSuccessHandler(function(member){
        closeMemberModal();
        document.getElementById('phone').value = member.phone || phone;
        document.getElementById('newMemberName').value = '';
        currentMember = member;
        cacheMember(member);
        const box = document.getElementById('memberbox');
        box.style.display = 'block';
        box.className = 'memberbox';
        box.innerHTML = '<b>เพิ่มสมาชิกสำเร็จ ✓</b>' +
          (member.name ? ' • ' + esc(member.name) : '') +
          '<br>สมาชิกถูกผูกกับบิลนี้แล้ว';
        document.getElementById('addMemberBtn').style.display = 'none';
      })
      .withFailureHandler(showError)
      .addMemberByStaff({name:name, phone:phone});
  }

  function selectPayment(method){
    paymentMethod = method;
    document.getElementById('cashBtn').classList.toggle('active', method === 'เงินสด');
    document.getElementById('promptBtn').classList.toggle('active', method === 'พร้อมเพย์');
    document.getElementById('cashbox').style.display = method === 'เงินสด' ? 'block' : 'none';

    if(method === 'พร้อมเพย์'){
      document.getElementById('cashReceived').value = '';
    }
    calcChange();
  }

  function clearCashReceived(){
    const input = document.getElementById('cashReceived');
    if (!input) return;
    input.value = '';
    calcChange();
    input.focus();
  }

  function setExactCash(){
    const input = document.getElementById('cashReceived');
    input.value = getTotal();
    calcChange();
  }

  function addCash(amount){
    const input = document.getElementById('cashReceived');
    const current = Number(input.value || 0);
    input.value = current + Number(amount || 0);
    calcChange();
  }

  function calcChange(){
    const total = getTotal();
    const received = Number(document.getElementById('cashReceived').value || 0);
    const change = Math.max(received - total, 0);
    document.getElementById('change').textContent = 'เงินทอน ' + money(change) + ' บาท';
  }

  function makeClientTransactionId(){
    let deviceId = localStorage.getItem('baacPosDeviceId');
    if(!deviceId){
      deviceId = 'DEV-' + Date.now().toString(36).toUpperCase() + '-' +
        Math.random().toString(36).slice(2,7).toUpperCase();
      localStorage.setItem('baacPosDeviceId', deviceId);
    }
    return deviceId + '-' + Date.now() + '-' +
      Math.random().toString(36).slice(2,8).toUpperCase();
  }

  function getPendingSales(){
    try{
      const rows = JSON.parse(localStorage.getItem('baacPendingSales') || '[]');
      return Array.isArray(rows) ? rows : [];
    }catch(e){
      return [];
    }
  }

  function savePendingSales(rows){
    localStorage.setItem('baacPendingSales', JSON.stringify(rows || []));
    updatePendingBadge();
  }

  function updatePendingBadge(){
    const count = getPendingSales().length;
    const badge = document.getElementById('syncBadge');
    if(!badge) return;
    badge.textContent = 'รอซิงก์ ' + count;
    badge.classList.toggle('show', count > 0);
  }

  function updateConnectionStatus(forceOffline){
    const offline = forceOffline === true || !navigator.onLine;
    const box = document.getElementById('connectionStatus');
    const label = document.getElementById('connectionText');
    if(!box || !label) return;
    box.classList.toggle('offline', offline);
    label.textContent = offline ? 'ออฟไลน์' : 'ออนไลน์';
  }

  function reserveOfflineStock(items){
    items.forEach(function(item){
      const p = products.find(x => x.id === item.id);
      if(p) p.stock = Math.max(Number(p.stock || 0) - Number(item.qty || 0), 0);
    });
    try{
      localStorage.setItem('baacPosProductsCache', JSON.stringify(products));
    }catch(e){}
    renderProducts();
  }

  function queueSaleOffline(payload){
    const pending = getPendingSales();
    if(!pending.some(x => x.clientTransactionId === payload.clientTransactionId)){
      pending.push(payload);
      savePendingSales(pending);
      reserveOfflineStock(payload.items || []);
      return true;
    }
    return false;
  }

  function removePendingSale(clientTransactionId){
    const latest = getPendingSales().filter(function(x){
      return x.clientTransactionId !== clientTransactionId;
    });
    savePendingSales(latest);
    return latest;
  }

  function baacNumberVoiceParts(value){
    let n = Math.max(0, Math.floor(Number(value) || 0));
    if(n === 0) return ['zero'];
    const p = [];
    if(n >= 1000){
      const t = Math.floor(n / 1000);
      if(t <= 9) p.push(['zero','one','two','three','four','five','six','seven','eight','nine'][t]);
      n %= 1000;
      p.push('thousand');
    }
    if(n >= 100){
      const h = Math.floor(n / 100);
      p.push(['zero','one','two','three','four','five','six','seven','eight','nine'][h], 'hundred');
      n %= 100;
    }
    if(n >= 20){
      const t = Math.floor(n / 10);
      if(t === 2) p.push('twenty');
      else p.push(['zero','one','two','three','four','five','six','seven','eight','nine'][t], 'ten');
      n %= 10;
    }else if(n >= 10){
      p.push('ten');
      n -= 10;
    }
    if(n > 0) p.push(['zero','one','two','three','four','five','six','seven','eight','nine'][n]);
    return p;
  }

  function playBaacVoiceSequence(keys){
    let i = 0;
    const next = () => {
      if(i >= keys.length) return;
      const src = BAAC_VOICE[keys[i++]];
      if(!src){ next(); return; }
      const audio = new Audio(src);
      audio.preload = 'auto';
      audio.onended = () => setTimeout(next, 110);
      audio.onerror = next;
      audio.play().catch(() => {});
    };
    next();
  }

  function speakCheckoutResult(result){
    if(!result) return;
    const change = Math.max(0, Number(result.change || 0));
    if(result.paymentMethod === 'เงินสด' && change > 0){
      const whole = Math.floor(change);
      const satang = Math.round((change - whole) * 100);
      const seq = ['change'].concat(baacNumberVoiceParts(whole), ['baht']);
      if(satang === 50) seq.push('satang50');
      seq.push('thanks');
      playBaacVoiceSequence(seq);
    }else{
      playBaacVoiceSequence(['thanks']);
    }
  }

  function showCheckoutResult(result, queued){
    document.getElementById('loading').classList.remove('show');
    document.getElementById('successTotal').textContent =
      'ยอดชำระ ' + money(result.total) + ' บาท';

    document.getElementById('successChange').textContent =
      result.paymentMethod === 'เงินสด'
        ? 'เงินทอน ' + money(result.change) + ' บาท'
        : 'ชำระด้วยพร้อมเพย์';

    document.getElementById('successPoints').textContent = queued
      ? 'บันทึกไว้ในเครื่อง • รอซิงก์เมื่ออินเทอร์เน็ตกลับมา'
      : (result.memberFound ? 'ได้รับ ' + money(result.pointsEarned) + ' คะแนน' : '');

    document.getElementById('successModal').classList.add('show');
    speakCheckoutResult(result);
  }

  function checkout(){
    if(!cart.length){ showAppAlert('กรุณาเลือกสินค้า','ยังไม่มีสินค้าในบิล','error'); return; }
    if(!paymentMethod){ showAppAlert('กรุณาเลือก เงินสด หรือ พร้อมเพย์','วิธีชำระเงิน','error'); return; }

    const total = getTotal();
    const cashReceived = Number(document.getElementById('cashReceived').value || 0);

    if(paymentMethod === 'เงินสด' && cashReceived < total){
      showAppAlert('จำนวนเงินที่รับน้อยกว่ายอดชำระ','จำนวนเงินไม่ถูกต้อง','error'); return;
    }

    const phone = normalizePhoneClient(document.getElementById('phone').value.trim());
    document.getElementById('phone').value = phone;

    const payload = {
      clientTransactionId: makeClientTransactionId(),
      items: cart.map(x => ({id:x.id, qty:x.qty})),
      paymentMethod: paymentMethod,
      cashReceived: cashReceived,
      phone: phone,
      offlineCreatedAt: new Date().toISOString()
    };

    /* หลักสำคัญ: เก็บบิลไว้ในเครื่องก่อนเสมอ */
    queueSaleOffline(payload);

    if(!navigator.onLine){
      updateConnectionStatus();
      showCheckoutResult({
        total:total,
        paymentMethod:paymentMethod,
        change:paymentMethod === 'เงินสด' ? cashReceived-total : 0,
        memberFound:!!currentMember,
        pointsEarned:0
      }, true);
      return;
    }

    document.getElementById('loading').classList.add('show');

    google.script.run
      .withSuccessHandler(function(result){
        /* runner จะ success ได้หลัง api=tx ยืนยันแล้วเท่านั้น */
        removePendingSale(payload.clientTransactionId);
        document.getElementById('loading').classList.remove('show');
        showCheckoutResult(result, false);
        refreshMemberCache();
        loadProducts();
        syncPendingSales();
      })
      .withFailureHandler(function(err){
        document.getElementById('loading').classList.remove('show');

        /* ห้ามลบบิลออกจากคิวเมื่อยังยืนยันไม่ได้ */
        updatePendingBadge();

        if(!navigator.onLine || /network|fetch|connection|internet|offline|ยืนยัน/i.test(String(err && err.message || err || ''))){
          updateConnectionStatus(!navigator.onLine);
          showCheckoutResult({
            total:total,
            paymentMethod:paymentMethod,
            change:paymentMethod === 'เงินสด' ? cashReceived-total : 0,
            memberFound:!!currentMember,
            pointsEarned:0
          }, true);
        }else{
          showError(err);
        }
      })
      .checkoutSale(payload);
  }

  let syncRunning = false;

  async function syncOnePendingSale(item){
    if(!item || !item.clientTransactionId) throw new Error('บิลรอซิงก์ไม่มีรหัสธุรกรรม');

    /* 1) เช็กก่อน เผื่อเซิร์ฟเวอร์เคยรับแล้ว */
    try{
      const before = await baacJsonp('tx',{id:item.clientTransactionId});
      if(before && before.success && before.found === true){
        return before;
      }
    }catch(e){}

    /* 2) ถ้ายังไม่มี จึงส่ง */
    await baacPost(Object.assign({api:'checkout'}, item));

    /* 3) ห้ามถือว่าสำเร็จจนกว่าเซิร์ฟเวอร์ยืนยัน transaction เดิม */
    return await baacWaitTx(item.clientTransactionId);
  }

  async function syncPendingSales(){
    if(syncRunning || !navigator.onLine) return;

    const pending = getPendingSales();
    if(!pending.length){
      updatePendingBadge();
      return;
    }

    syncRunning = true;

    try{
      for(const item of pending){
        if(!navigator.onLine) break;

        try{
          await syncOnePendingSale(item);
          removePendingSale(item.clientTransactionId);
        }catch(err){
          /* เก็บบิลไว้ หยุดรอบนี้ แล้วลองใหม่เมื่อออนไลน์/รอบถัดไป */
          updatePendingBadge();
          break;
        }
      }

      const left = getPendingSales();
      updateConnectionStatus(!navigator.onLine);

      if(!left.length){
        showToast('ซิงก์รายการขายเรียบร้อยแล้ว');
        refreshMemberCache();
        loadProducts();
      }
    }finally{
      syncRunning = false;
    }
  }

  function loadHistoryDates(){
    const dateBox = document.getElementById('historyDates');
    const list = document.getElementById('historyList');

    dateBox.innerHTML = '';
    list.innerHTML = '<div class="empty">กำลังโหลด...</div>';

    google.script.run
      .withSuccessHandler(function(dates){
        dates = dates || [];

        if(!dates.length){
          list.innerHTML = '<div class="empty">ยังไม่มีรายการขาย</div>';
          return;
        }

        historySelectedDate = dates[0];

        dateBox.innerHTML = dates.map(function(d, index){
          return `<button class="history-date-pill ${index === 0 ? 'active' : ''}"
                    onclick="selectHistoryDate('${escAttr(d)}', this)">${esc(d)}</button>`;
        }).join('');

        loadHistoryDate(historySelectedDate);
      })
      .withFailureHandler(showError)
      .getSalesHistoryDates();
  }

  function selectHistoryDate(dateText, btn){
    historySelectedDate = dateText;

    document.querySelectorAll('.history-date-pill').forEach(function(el){
      el.classList.remove('active');
    });

    if(btn) btn.classList.add('active');
    loadHistoryDate(dateText);
  }

        list.innerHTML = bills.map(function(bill, billIndex){
          const cancelled = bill.status === 'ยกเลิก';

          const memberText = bill.memberId
            ? (esc(bill.memberId) +
               (bill.memberName ? ' • ' + esc(bill.memberName) : '') +
               (bill.memberPhone ? ' • ' + esc(bill.memberPhone) : ''))
            : 'ไม่ระบุสมาชิก';

          const items = (bill.items || []).map(function(item){
            return '<div class="bill-item">' +
              '<div>' + esc(item.product) + ' × ' + item.qty +
              (item.unit ? ' ' + esc(item.unit) : '') + '</div>' +
              '<div><b>' + money(item.total) + ' บาท</b></div>' +

          const saleIdsJson = JSON.stringify(bill.saleIds || []).replace(/'/g, '&#39;');

          return '<div class="history-bill-card ' + (cancelled ? 'cancelled' : '') + '">' +
            (cancelled ? '<div class="cancel-badge">ยกเลิกบิล</div>' : '') +
            '<div class="bill-head">' +
              '<div><div class="bill-code">บิล ' + billLabel + '</div>' +
              '<div class="bill-meta">ชำระเวลา ' + esc(bill.time || '-') + '</div></div>' +
              '<div class="bill-total">' + money(bill.total) + ' บาท</div>' +
            '</div>' +
            '<div class="bill-member"><b>สมาชิก:</b> ' + memberText + '</div>' +
            '<div class="bill-items">' + items + '</div>' +
            '<div class="bill-bottom">' +
              '<div><b>วิธีชำระเงิน:</b> ' + esc(bill.payment || '-') + '</div>' +
              (cancelled ? '' :
                '<button class="voidbtn" data-saleids="' +
                encodeURIComponent(JSON.stringify(bill.saleIds || [])) +
                '" onclick="cancelBillFromButton(this)">ยกเลิกบิล</button>') +
            '</div>' +
            (cancelled
              ? '<div class="cancel-note"><b>เหตุผล:</b> ' + esc(bill.cancelReason || '-') +
                '<br><b>ยกเลิกเมื่อ:</b> ' + esc(bill.cancelDate || '-') + ' ' +
                esc(bill.cancelTime || '') + '</div>'
              : '') +
          '</div>';
        }).join('');
      })
      .withFailureHandler(showError)
      .getBillsByDate(dateText);
  }

  async function cancelBillFromButton(btn){
    let saleIds = [];
    try{
      saleIds = JSON.parse(decodeURIComponent(btn.getAttribute('data-saleids') || '%5B%5D'));
    }catch(e){
      showAppAlert('ไม่สามารถอ่านข้อมูลบิลได้','เกิดข้อผิดพลาด','error');
      return;
    }

    const reason = await showReasonDialog();
    if(reason === null) return;

    google.script.run
      .withSuccessHandler(function(){
        showToast('ยกเลิกบิลเรียบร้อยแล้ว');
        loadHistoryDate(historySelectedDate);
        loadProducts();
      })
      .withFailureHandler(showError)
      .cancelBill(saleIds, reason);
  }

  function getHistoryExportData(callback){
    if(!historySelectedDate){
      showAppAlert('กรุณาเลือกวันที่','สรุปรายการขาย','error');
      return;
    }

    google.script.run
      .withSuccessHandler(function(result){
        const allRows = result && result.rows ? result.rows : [];
        const rows = allRows.filter(function(x){ return x.status !== 'ยกเลิก'; });
        if(!rows.length){
          showAppAlert('ไม่มีรายการขายที่ใช้งานในวันที่เลือก','สรุปรายการขาย','error');
          return;
        }
        callback(rows);
      })
      .withFailureHandler(showError)
      .getSalesByDate(historySelectedDate);
  }

  function buildHistoryExportSheet(rows){
    const old = document.getElementById('historyExportSheet');
    if(old) old.remove();

    const total = rows.reduce(function(sum,x){
      return sum + Number(x.total || 0);
    },0);

    const cashTotal = rows.reduce(function(sum,x){
      return sum + (String(x.payment || '') === 'เงินสด' ? Number(x.total || 0) : 0);
    },0);

    const promptpayTotal = rows.reduce(function(sum,x){
      return sum + (String(x.payment || '') === 'พร้อมเพย์' ? Number(x.total || 0) : 0);
    },0);

    const productSummary = {};
    rows.forEach(function(x){
      const key = String(x.product || '');
      if(!productSummary[key]){
        productSummary[key] = {
          name:key,
          qty:0,
          unit:String(x.unit || x.productUnit || x.unitName || '')
        };
      }
      productSummary[key].qty += Number(x.qty || 0);
      if(!productSummary[key].unit){
        productSummary[key].unit = String(x.unit || x.productUnit || x.unitName || '');
      }
    });

    const productRows = Object.values(productSummary)
      .sort(function(a,b){ return b.qty - a.qty; });

    const sheet = document.createElement('div');
    sheet.id = 'historyExportSheet';
    sheet.className = 'export-sheet';

    sheet.innerHTML = `
      <div class="export-title">BAAC SMART OUTLET</div>
            <div class="export-subtitle">รายการขายประจำวันที่ ${esc(historySelectedDate)}</div>

      <div class="export-section-title">สรุปยอดขาย</div>
      <div class="export-kpi-grid">
        <div class="export-kpi">
          <div class="kpi-label">ขายสินค้าทั้งหมด</div>
          <div class="kpi-value">${rows.length} รายการ</div>
        </div>
        <div class="export-kpi">
          <div class="kpi-label">จำนวนเงินทั้งหมด</div>
          <div class="kpi-value">${money(total)} บาท</div>
        </div>
        <div class="export-kpi">
          <div class="kpi-label">จำนวนเงินสด</div>
          <div class="kpi-value">${money(cashTotal)} บาท</div>
        </div>
        <div class="export-kpi">
          <div class="kpi-label">จำนวนพร้อมเพย์</div>
          <div class="kpi-value">${money(promptpayTotal)} บาท</div>
        </div>
      </div>

      <div class="export-section-title">รายละเอียดรายการขาย</div>
      <table class="export-table">
        <thead>
          <tr>
            <th>รหัสสมาชิก</th>
            <th>เวลา</th>
            <th>สินค้า</th>
            <th>จำนวน</th>
            <th>ยอดรวม</th>
            <th>ชำระเงิน</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(function(x){
            return `
              <tr>
                <td>${esc(x.memberId || '-')}</td>
                <td>${esc(x.time || '')}</td>
                <td>${esc(x.product || '')}</td>
                <td>${x.qty || 0}</td>
                <td>${money(x.total)} บาท</td>
                <td>${esc(x.payment || '-')}</td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>

      <div class="export-section-title">สรุปสินค้าขายทั้งหมด</div>
      <div class="export-product-summary">
        ${productRows.map(function(x){
          return `
            <div class="export-product-row">
              <div class="name">${esc(x.name)}</div>
              <div class="qty">จำนวน ${x.qty} ${esc(x.unit || '')}</div>
            </div>
          `;
        }).join('')}
      </div>

      <div class="export-footer">
        BAAC SMART OUTLET • ระบบบริหารร้านฝากขายอัจฉริยะ
      </div>
    `;

    document.body.appendChild(sheet);
    return sheet;
  }

  function exportHistoryImage(){
    getHistoryExportData(function(rows){
      const sheet = buildHistoryExportSheet(rows);

      html2canvas(sheet,{
        scale:2,
        backgroundColor:'#ffffff',
        useCORS:true
      }).then(function(canvas){
        const link = document.createElement('a');
        link.download = 'ยอดขาย_' + historySelectedDate.replace(/\//g,'-') + '.jpg';
        link.href = canvas.toDataURL('image/jpeg', 0.95);
        link.click();
        sheet.remove();
      }).catch(function(err){
        sheet.remove();
        showError(err);
      });
    });
  }

  function exportHistoryPDF(){
    getHistoryExportData(function(rows){
      const sheet = buildHistoryExportSheet(rows);

      html2canvas(sheet,{
        scale:2,
        backgroundColor:'#ffffff',
        useCORS:true
      }).then(function(canvas){
        const imgData = canvas.toDataURL('image/png');
        const jsPDF = window.jspdf.jsPDF;

        const pdf = new jsPDF({
          orientation:'portrait',
          unit:'mm',
          format:'a4'
        });

        const pageWidth = 210;
        const pageHeight = 297;
        const margin = 10;
        const usableWidth = pageWidth - (margin * 2);
        const imgHeight = canvas.height * usableWidth / canvas.width;

        if(imgHeight <= pageHeight - (margin * 2)){
          pdf.addImage(imgData,'PNG',margin,margin,usableWidth,imgHeight);
        }else{
          const pageCanvas = document.createElement('canvas');
          const pageCtx = pageCanvas.getContext('2d');

          const pxPerMm = canvas.width / usableWidth;
          const pageContentHeightPx = (pageHeight - margin * 2) * pxPerMm;

          pageCanvas.width = canvas.width;
          pageCanvas.height = Math.floor(pageContentHeightPx);

          let y = 0;
          let page = 0;

          while(y < canvas.height){
            pageCtx.clearRect(0,0,pageCanvas.width,pageCanvas.height);
            pageCtx.fillStyle = '#ffffff';
            pageCtx.fillRect(0,0,pageCanvas.width,pageCanvas.height);

            pageCtx.drawImage(
              canvas,
              0,y,
              canvas.width,Math.min(pageCanvas.height,canvas.height-y),
              0,0,
              canvas.width,Math.min(pageCanvas.height,canvas.height-y)
            );

            const pageImg = pageCanvas.toDataURL('image/png');
            if(page > 0) pdf.addPage();
            pdf.addImage(
              pageImg,'PNG',
              margin,margin,
              usableWidth,
              pageCanvas.height / pxPerMm
            );

            y += pageCanvas.height;
            page++;
          }
        }

        pdf.save('ยอดขาย_' + historySelectedDate.replace(/\//g,'-') + '.pdf');
        sheet.remove();
      }).catch(function(err){
        sheet.remove();
        showError(err);
      });
    });
  }

  function closeHistory(){
    document.getElementById('historyModal').classList.remove('show');
  }

  async function voidBill(saleId){
    const ok = await showAppConfirm(
      'ต้องการลบรายการขาย ' + saleId + ' ใช่หรือไม่?\nสต็อกสินค้าจะกลับคืนตามรายการที่ลบ',
      'ยืนยันการลบ',
      true
    );
    if(!ok) return;

    google.script.run
      .withSuccessHandler(function(){
        loadHistoryDate(historySelectedDate);
        loadProducts();
      })
      .withFailureHandler(showError)
      .voidSale(saleId);
  }

  function getHeldBills(){
    try{return JSON.parse(localStorage.getItem('baacHeldBills') || '[]');}
    catch(e){return [];}
  }

  function saveHeldBills(rows){
    localStorage.setItem('baacHeldBills', JSON.stringify(rows));
    updateHeldCount();
  }

  function updateHeldCount(){
    const el = document.getElementById('heldCount');
    if(el) el.textContent = getHeldBills().length;
  }

  function holdBill(){
    if(!cart.length) return showAppAlert('ยังไม่มีสินค้าในบิล','พักบิล','error');
    const rows = getHeldBills();
    rows.unshift({
      id:'HOLD-' + Date.now(),
      savedAt:new Date().toLocaleString('th-TH'),
      cart:cart,
      phone:document.getElementById('phone').value.trim()
    });
    saveHeldBills(rows);
    cart=[];
    paymentMethod='';
    currentMember=null;
    document.getElementById('phone').value='';
    document.getElementById('cashReceived').value='';
    document.getElementById('cashBtn').classList.remove('active');
    document.getElementById('promptBtn').classList.remove('active');
    document.getElementById('cashbox').style.display='none';
    resetMember();
    renderCart();
    showToast('พักบิลไว้แล้ว');
  }

  function openHeldBills(){
    document.getElementById('heldModal').classList.add('show');
    renderHeldBills();
  }

  function closeHeldBills(){
    document.getElementById('heldModal').classList.remove('show');
  }

  function renderHeldBills(){
    const rows=getHeldBills();
    const list=document.getElementById('heldList');
    if(!rows.length){
      list.innerHTML='<div class="empty">ไม่มีบิลที่พักไว้</div>';
      return;
    }
    list.innerHTML=rows.map(function(b){
      const total=(b.cart||[]).reduce((s,x)=>s+x.price*x.qty,0);
      const names=(b.cart||[]).map(x=>x.name+' × '+x.qty).join(', ');
      return `<div class="history-row">
        <div>
          <div class="history-name">${esc(names)}</div>
          <div class="history-meta">${esc(b.savedAt)}${b.phone ? ' • '+esc(b.phone) : ''}</div>
        </div>
        <div>
          <div class="history-total">${money(total)} บาท</div>
          <button class="resume-btn" onclick="resumeHeld('${escAttr(b.id)}')">เรียกบิล</button>
          <button class="delete-held" onclick="deleteHeld('${escAttr(b.id)}')">ลบ</button>
        </div>
      </div>`;
    }).join('');
  }

  function resumeHeld(id){
    const rows=getHeldBills();
    const b=rows.find(x=>x.id===id);
    if(!b) return;
    cart=b.cart||[];
    document.getElementById('phone').value=b.phone||'';
    saveHeldBills(rows.filter(x=>x.id!==id));
    closeHeldBills();
    renderCart();
    if(b.phone) checkMember();
  }

  async function deleteHeld(id){
    const ok = await showAppConfirm(
      'ต้องการลบบิลที่พักไว้นี้ใช่หรือไม่?',
      'ลบบิลที่พักไว้',
      true
    );
    if(!ok) return;

    saveHeldBills(getHeldBills().filter(x=>x.id!==id));
    renderHeldBills();
    showToast('ลบบิลที่พักไว้แล้ว');
  }


  function money(v){
    return Number(v || 0).toLocaleString('th-TH',{maximumFractionDigits:2});
  }

  function esc(v){
    return String(v ?? '').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function escAttr(v){
    return String(v ?? '').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  }

  function showError(err){
    showAppAlert(
      err && err.message ? err.message : String(err || 'เกิดข้อผิดพลาด'),
      'เกิดข้อผิดพลาด',
      'error'
    );
  }
</script>
